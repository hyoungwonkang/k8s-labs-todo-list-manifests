apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-list-backend-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hyoungwonkang/k8s-labs-v1.git
    targetRevision: main
    path: ch9-helm/labs/lab01/todo-list
    helm:
      parameters:
        - name: backend.image.tag
          value: "v1.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # 👈 이 줄 추가!
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
